name: Teabox
description: >-
  Teabox is a premium loose-leaf tea brand and direct-to-consumer e-commerce
  company backed by Accel. It sources fresh Darjeeling, Assam, Nilgiri and other
  Indian teas direct from gardens and ships them globally through its online
  store. The storefront runs on Shopify, which exposes an agent-commerce surface
  built on the Universal Commerce Protocol (UCP): a hosted shopping MCP endpoint,
  a machine-readable llms.txt / agents.md, and OpenID Connect authentication via
  the Shopify Customer Account API (including a customer-account MCP scope).
  Buyer checkout always requires explicit human approval. This profile was
  surfaced as an Accel portfolio company and enriched from Teabox's public
  agent-facing surfaces.
